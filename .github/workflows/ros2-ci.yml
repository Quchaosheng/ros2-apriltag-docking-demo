name: ROS 2 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-apriltag-msgs
          rosdep update
          rosdep install --from-paths src --ignore-src \
            --rosdistro jazzy -r -y

      - name: Check bilingual documentation
        run: python3 tests/test_docs.py

      - name: Build package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select demo2_apriltag_docking \
            --symlink-install --event-handlers console_direct+

      - name: Test package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select demo2_apriltag_docking \
            --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --test-result-base build --verbose
